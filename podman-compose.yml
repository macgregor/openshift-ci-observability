services:
  victoriametrics:
    container_name: ci-obs-victoriametrics
    image: docker.io/victoriametrics/victoria-metrics:v1.137.0
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    command:
      - "-retentionPeriod=365d"
      - "-search.disableCache"
      - "-dedup.minScrapeInterval=1ms"

  victorialogs:
    container_name: ci-obs-victorialogs
    image: docker.io/victoriametrics/victoria-logs:v1.48.0
    ports:
      - "9428:9428"
    volumes:
      - vl-data:/victoria-logs-data
    command:
      - "-retentionPeriod=365d"

  grafana:
    container_name: ci-obs-grafana
    image: docker.io/grafana/grafana:12.3.5
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:z
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_NEWS_NEWS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/ci-overview.json
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource,marcusolsson-treemap-panel
    depends_on:
      - victoriametrics
      - victorialogs

  scraper-watch:
    container_name: ci-obs-scraper-watch
    build:
      context: .
      dockerfile: Containerfile.scraper
    image: ci-obs-scraper:latest
    environment:
      - VM_URL=http://victoriametrics:8428
      - VL_URL=http://victorialogs:9428
      - REPO=${REPO:-opendatahub-io/opendatahub-operator}
      - WINDOW=${WATCH_WINDOW:-24h}
      - POLL_INTERVAL=${POLL_INTERVAL:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKERS=${WATCH_WORKERS:-8}
      - GCS_CACHE_DIR=/cache
    volumes:
      - gcs-cache:/cache
    command: ["watch"]
    depends_on:
      - victoriametrics
      - victorialogs

  scraper-backfill:
    container_name: ci-obs-scraper-backfill
    build:
      context: .
      dockerfile: Containerfile.scraper
    image: ci-obs-scraper:latest
    profiles:
      - backfill
    environment:
      - VM_URL=http://victoriametrics:8428
      - VL_URL=http://victorialogs:9428
      - REPO=${REPO:-opendatahub-io/opendatahub-operator}
      - WINDOW=${BACKFILL_WINDOW:-90d}
      - POLL_INTERVAL=${POLL_INTERVAL:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKERS=${BACKFILL_WORKERS:-16}
      - GCS_CACHE_DIR=/cache
    volumes:
      - gcs-cache:/cache
    command: ["backfill"]
    depends_on:
      - victoriametrics
      - victorialogs

volumes:
  vm-data:
    name: ci-obs-vm-data
  vl-data:
    name: ci-obs-vl-data
  grafana-data:
    name: ci-obs-grafana-data
  gcs-cache:
    name: ci-obs-gcs-cache
