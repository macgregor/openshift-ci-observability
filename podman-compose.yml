services:
  victoriametrics:
    container_name: ci-obs-victoriametrics
    image: docker.io/victoriametrics/victoria-metrics:v1.137.0
    cpus: 2
    mem_limit: 2g
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    restart: unless-stopped
    command:
      - "-retentionPeriod=365d"
      - "-dedup.minScrapeInterval=1ms"
      - "-search.maxMemoryPerQuery=256MB"
      - "-search.maxSeries=50000"
      - "-search.maxQueryDuration=30s"
      - "-search.logSlowQueryDuration=5s"
      - "-search.cacheTimestampOffset=0s"

  victorialogs:
    container_name: ci-obs-victorialogs
    image: docker.io/victoriametrics/victoria-logs:v1.48.0
    cpus: 1
    mem_limit: 1g
    ports:
      - "9428:9428"
    volumes:
      - vl-data:/victoria-logs-data
    restart: unless-stopped
    command:
      - "-retentionPeriod=365d"
      - "-delete.enable=true"

  grafana:
    container_name: ci-obs-grafana
    image: docker.io/grafana/grafana:12.3.5
    cpus: 1
    mem_limit: 512m
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:z
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_NEWS_NEWS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/ci-overview.json
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource,marcusolsson-treemap-panel
    restart: unless-stopped
    depends_on:
      - victoriametrics
      - victorialogs

  scraper-watch:
    container_name: ci-obs-scraper-watch
    build:
      context: .
      dockerfile: Containerfile.scraper
    image: ci-obs-scraper:latest
    cpus: 4
    mem_limit: 2g
    environment:
      - VM_URL=http://victoriametrics:8428
      - VL_URL=http://victorialogs:9428
      - REPO=${REPO:?Set REPO in .env to the GitHub org/repo to scrape (e.g. openshift/cluster-monitoring-operator)}
      - WINDOW=${WATCH_WINDOW:-24h}
      - POLL_INTERVAL=${POLL_INTERVAL:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKERS=${WATCH_WORKERS:-8}
      - GCS_CACHE_DIR=/cache
      - GCS_NO_CACHE=${GCS_NO_CACHE:-}
      - CACHE_RETENTION=${CACHE_RETENTION:-}
      - PROMTOOL_WORKERS=${PROMTOOL_WORKERS:-1}
      - MAX_WAL_MB=${MAX_WAL_MB:-256}
    volumes:
      - gcs-cache:/cache
    restart: unless-stopped
    command: ["watch"]
    depends_on:
      - victoriametrics
      - victorialogs

  scraper-backfill:
    container_name: ci-obs-scraper-backfill
    build:
      context: .
      dockerfile: Containerfile.scraper
    image: ci-obs-scraper:latest
    cpus: 4
    mem_limit: 4g
    profiles:
      - backfill
    environment:
      - VM_URL=http://victoriametrics:8428
      - VL_URL=http://victorialogs:9428
      - REPO=${REPO:?Set REPO in .env to the GitHub org/repo to scrape (e.g. openshift/cluster-monitoring-operator)}
      - WINDOW=${BACKFILL_WINDOW:-90d}
      - POLL_INTERVAL=${POLL_INTERVAL:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKERS=${BACKFILL_WORKERS:-64}
      - GCS_CACHE_DIR=/cache
      - GCS_NO_CACHE=${GCS_NO_CACHE:-}
      - CACHE_RETENTION=${CACHE_RETENTION:-}
      - PROMTOOL_WORKERS=${PROMTOOL_WORKERS:-2}
      - MAX_WAL_MB=${MAX_WAL_MB:-400}
    volumes:
      - gcs-cache:/cache
    restart: on-failure
    command: ["backfill"]
    depends_on:
      - victoriametrics
      - victorialogs

volumes:
  vm-data:
    name: ci-obs-vm-data
  vl-data:
    name: ci-obs-vl-data
  grafana-data:
    name: ci-obs-grafana-data
  gcs-cache:
    name: ci-obs-gcs-cache
